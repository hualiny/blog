# 推送到默认分支后：构建静态站点并发布到 GitHub Pages。
# 仓库设置 → Pages → Build and deployment → Source 选「GitHub Actions」。
#
# 可选：Settings → Secrets and variables → Actions → Variables
#   SITE_URL    站点完整 URL，例如 https://yourname.github.io 或自定义域名
#   BASE_PATH   子路径部署时填写，例如 /blog（Project Pages）；根目录部署留空
#
# Cloudflare Pages：在 Cloudflare 控制台「Workers & Pages」→ 连接同一 GitHub 仓库，
# 构建命令 bun run build，输出目录 dist，并在该环境的 Variables 中同样配置 SITE_URL（及需要时的 BASE_PATH）。

name: Deploy static site to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
